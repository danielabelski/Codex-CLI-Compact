<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrapeRoot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="2"/>
            <circle cx="14" cy="8" r="2.5" fill="currentColor"/>
            <circle cx="8" cy="18" r="2.5" fill="currentColor"/>
            <circle cx="20" cy="18" r="2.5" fill="currentColor"/>
            <line x1="14" y1="10.5" x2="9" y2="16" stroke="currentColor" stroke-width="1.5"/>
            <line x1="14" y1="10.5" x2="19" y2="16" stroke="currentColor" stroke-width="1.5"/>
            <line x1="10" y1="18" x2="18" y2="18" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="logo-text">GrapeRoot</span>
        </div>
        <span class="version-badge" id="version">v--</span>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">PROJECT</div>
        <div class="selected-project" id="selected-project">
          <button class="btn-choose-folder" id="btn-choose-folder">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 5.5V14a1.5 1.5 0 001.5 1.5h11A1.5 1.5 0 0016 14V7a1.5 1.5 0 00-1.5-1.5H9L7.5 3.5H3.5A1.5 1.5 0 002 5v.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span id="chosen-folder-text">Choose Project Folder</span>
          </button>
        </div>
        <div class="recent-projects" id="recent-projects"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">GRAPH STATS</div>
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="stat-files">--</div>
            <div class="stat-label">Files</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-symbols">--</div>
            <div class="stat-label">Symbols</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-nodes">--</div>
            <div class="stat-label">Nodes</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-edges">--</div>
            <div class="stat-label">Edges</div>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="setting-row">
          <span>Telemetry</span>
          <label class="toggle-switch small">
            <input type="checkbox" id="telemetry-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="content">
      <header class="content-header">
        <div>
          <h1>AI Coding Tools</h1>
          <p class="subtitle">Toggle MCP access for each tool</p>
        </div>
        <div class="header-actions">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input type="text" id="tool-search" placeholder="Search tools...">
          </div>
        </div>
      </header>

      <div class="tools-grid" id="tools-grid">
        <!-- Tool cards injected by JS -->
      </div>

      <!-- Status Bar -->
      <div class="status-bar" id="status-bar">
        <div class="status-dot"></div>
        <span id="status-text">MCP server not running</span>
        <div class="status-actions">
          <button class="btn btn-mcp-start" onclick="startMcp()">Start MCP</button>
          <button class="btn btn-mcp-stop" onclick="stopMcp()">Stop MCP</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Folder Browser Modal -->
  <div class="modal-overlay" id="folder-modal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2>Choose Project Folder</h2>
        <button class="btn-icon modal-close" id="modal-close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-breadcrumb" id="modal-breadcrumb"></div>
      <div class="folder-list" id="folder-list"></div>
      <div class="modal-footer">
        <div class="modal-selected" id="modal-selected-path">No folder selected</div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
          <button class="btn btn-confirm" id="modal-confirm" disabled>Select &amp; Scan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
